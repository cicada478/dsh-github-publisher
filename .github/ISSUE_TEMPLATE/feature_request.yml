name: 功能建议
description: 提议一项新功能或规则改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目对新增规则有明确门槛：**每条规则必须能追溯到一手依据来源**。
        提建议时请一并说明依据，否则难以合并。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue 与 `references/checks.md`，确认这不是已有或已拒绝的项
          required: true

  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 新增敏感信息检测规则
        - 新增仓库规范检查项
        - 改进 README / Release 文案生成
        - 改进交互与决策分级
        - 新增脚本或命令
        - 文档改进
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前做法的不足。请聚焦问题本身，而非预设的实现方式。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你的方案
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: 依据来源
      description: |
        若建议涉及新增规则，此项为**必填**。
        请给出 CWE 编号、厂商文档、RFC 或规范的链接。
      placeholder: "https://cwe.mitre.org/data/definitions/798.html"
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: 建议的严重级别
      description: 仅新增检查项时填写。级别定义见 `references/checks.md`。
      options:
        - 不适用
        - BLOCKER（阻断提交与推送）
        - MAJOR（需人工确认豁免）
        - MINOR（提示，不阻断）
        - INFO（仅记录）
    validations:
      required: false

  - type: textarea
    id: false-positive
    attributes:
      label: 误报风险评估
      description: |
        仅新增检测规则时填写。
        说明什么**正常**代码或文档可能被这条规则误判，以及你建议如何降低误报。
        本项目把假阳性视为硬阻断机制的主要失效原因，因此这一项很重要。
    validations:
      required: false
